services:
  # Web Service - FastAPI Backend API
  - type: web
    name: postpilot-api
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    disk:
      name: postpilot-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_PATH
        value: /var/data/app.db
      - key: DOWNLOAD_PATH
        value: /var/data/videos
      - key: LOG_PATH
        value: /var/data/logs
      - key: REDIS_URL
        fromService:
          name: postpilot-redis
          type: redis
          property: connectionString
      - fromGroup: facebook-credentials
      - fromGroup: system-config

  # Web Service - Streamlit Dashboard
  - type: web
    name: postpilot-dashboard
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard/streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: API_BASE_URL
        fromService:
          name: postpilot-api
          type: web
          property: host
          # Note: set this manually as https://<postpilot-api>.onrender.com after first deploy

  # Worker Service - RQ Background Task Worker
  - type: worker
    name: postpilot-worker
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python run_worker.py
    disk:
      name: postpilot-worker-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: WORKER_MODE
        value: worker
      - key: DATABASE_PATH
        value: /var/data/app.db
      - key: DOWNLOAD_PATH
        value: /var/data/videos
      - key: LOG_PATH
        value: /var/data/logs
      - key: REDIS_URL
        fromService:
          name: postpilot-redis
          type: redis
          property: connectionString
      - fromGroup: facebook-credentials
      - fromGroup: system-config

  # Worker Service - Scheduler
  - type: worker
    name: postpilot-scheduler
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python run_scheduler.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_PATH
        value: /var/data/app.db
      - key: REDIS_URL
        fromService:
          name: postpilot-redis
          type: redis
          property: connectionString
      - fromGroup: facebook-credentials
      - fromGroup: system-config

  # Redis Service
  - type: redis
    name: postpilot-redis
    plan: free
    ipAllowList: []

envVarGroups:
  - name: facebook-credentials
    envVars:
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: FACEBOOK_ACCESS_TOKEN
        sync: false

  - name: system-config
    envVars:
      - key: MAX_POSTS_PER_DAY
        value: "15"
      - key: SCRAPE_INTERVAL
        value: "30"
      - key: POST_INTERVAL
        value: "60"
      - key: MAX_VIDEOS_PER_KEYWORD
        value: "50"
      - key: MAX_DOWNLOAD_RETRIES
        value: "3"
      - key: MAX_POST_RETRIES
        value: "3"
